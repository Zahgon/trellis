# What the web server's own machinery says about itself. Helidon logs through java.util.logging, and
# a deployment that says nothing about logging should not be flooded by it.
handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS.%1$tL %4$s %3$s %5$s%6$s%n
io.helidon.level=WARNING
io.netty.level=WARNING
