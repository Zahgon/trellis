plugins {
    id 'java-library'
}

description = "Trellis Helidon"

sourceCompatibility = 11
targetCompatibility = 11

dependencies {
    api platform("io.helidon:helidon-dependencies:$helidonVersion")

    api "io.helidon.webserver:helidon-webserver"
    api project(':trellis-api')
    api project(':trellis-http')
    api project(':trellis-cache')

    implementation platform("com.fasterxml.jackson:jackson-bom:$jacksonVersion")
    implementation platform("org.eclipse.microprofile:microprofile:$microprofileVersion")

    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"
    implementation "com.google.guava:guava:$guavaVersion"
    implementation "org.eclipse.microprofile.config:microprofile-config-api"
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation project(':trellis-vocabulary')
    implementation project(':trellis-audit')
    implementation project(':trellis-webac')
    implementation project(':trellis-auth-basic')
    implementation project(':trellis-oauth')

    testRuntimeOnly "jakarta.activation:jakarta.activation-api:$activationApiVersion"

    testImplementation "ch.qos.logback:logback-classic:$logbackVersion"
    testImplementation "io.smallrye.config:smallrye-config:$smallryeConfigVersion"
    testImplementation "org.hamcrest:hamcrest:$hamcrestVersion"
    testImplementation "org.apache.jena:jena-arq:$jenaVersion"
    testImplementation "org.apache.jena:jena-commonsrdf:$jenaVersion"
    testImplementation "org.apache.jena:jena-rdfconnection:$jenaVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
    testImplementation project(':trellis-app')
    testImplementation project(':trellis-constraint')
    testImplementation project(':trellis-file')
    testImplementation project(':trellis-jena')
    testImplementation project(':trellis-rdfa')
    testImplementation project(':trellis-triplestore')
}

jar {
    manifest {
        attributes('Automatic-Module-Name': "org.trellisldp.helidon")
    }
}

java {
    disableAutoTargetJvm()
}
